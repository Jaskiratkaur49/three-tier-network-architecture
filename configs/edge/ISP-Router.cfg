! ==========================================================
! Device: ISP
! Role: Simulated ISP / WAN Router
! Project: Three-Tier Enterprise Network Architecture
! Configuration: Sanitized for public GitHub repository
! ==========================================================

version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname ISP
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn <REDACTED>
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!

! Note: IP addresses in this configuration are used only
! for the Cisco Packet Tracer lab environment.
! Loopback0 (8.8.8.8/32) simulates an external Internet endpoint.

interface Loopback0
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 200.0.1.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 200.0.2.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 10.0.0.0 255.0.0.0 200.0.1.2 
ip route 10.0.0.0 255.0.0.0 200.0.2.2 10
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end